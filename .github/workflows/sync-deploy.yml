name: Sync & Deploy

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:

jobs:
  sync-and-deploy:
    name: Sync upstream then deploy if changed
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: huilang-me/CF-Server-Monitor
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      # 门禁：上游有新版 或 手动触发 才部署
      - name: Setup Node.js
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install

      - name: Build frontend assets
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build:frontend

      - name: Create wrangler.toml
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "server-monitor-pro"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          # 定时任务配置（UTC）
          # - 每分钟：执行离线节点检测
          # - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          [vars]
          API_SECRET = "SECRET_PLACEHOLDER"
          API_USER_NAME = "USER_NAME_PLACEHOLDER"
          CORS_ALLOWED_ORIGINS = "CORS_ORIGINS_PLACEHOLDER"
          WEOF

          # 替换占位符
          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.toml
          sed -i "s|SECRET_PLACEHOLDER|${{ secrets.API_SECRET }}|g" wrangler.toml
          sed -i "s|USER_NAME_PLACEHOLDER|${{ secrets.API_USER_NAME }}|g" wrangler.toml
          sed -i "s|CORS_ORIGINS_PLACEHOLDER|${{ secrets.CORS_ALLOWED_ORIGINS }}|g" wrangler.toml

          echo "✅ wrangler.toml 已生成"

      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
