name: Quota Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping cf-quota-monitor
        run: |
          set -e
          echo "target: https://quota.ccxl.ccwu.cc/api/check"
          code=$(curl -sS -m 60 -o resp.json -w "%{http_code}" https://quota.ccxl.ccwu.cc/api/check || echo "000")
          echo "HTTP ${code}"
          echo "----- body (first 400 chars) -----"
          head -c 400 resp.json || true
          echo
          echo "----- end -----"
          if [ "$code" != "200" ]; then
            echo "::error::quota check failed with HTTP ${code}"
            exit 1
          fi
